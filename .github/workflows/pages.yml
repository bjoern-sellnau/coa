name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/great-allen-1jbDO]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html arena.html dist/

      - name: Push to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bjoern-sellnau/coa.git HEAD:gh-pages
